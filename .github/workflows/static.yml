<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工業革命：生存的代價 2.0</title>
    <style>
        /* 視覺風格：工業革命工廠感 */
        body { 
            background-color: #1a1a1a; color: #d1d1d1; font-family: 'Noto Sans TC', sans-serif;
            margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background-image: linear-gradient(rgba(0,0,0,0.88), rgba(0,0,0,0.88)), url('https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&q=80&w=1000');
            background-size: cover; overflow: hidden;
        }

        #game-container { 
            max-width: 600px; width: 95%; background: rgba(30, 30, 30, 0.98);
            border: 2px solid #555; border-radius: 12px; padding: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,1); position: relative;
        }

        h2 { text-align: center; color: #d4af37; margin-top: 0; text-transform: uppercase; border-bottom: 2px solid #d4af37; padding-bottom: 10px; font-size: 1.4em; }

        .stats { 
            display: flex; justify-content: space-around; background: #000;
            padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #444;
        }

        .stat-box { text-align: center; }
        .stat-label { font-size: 0.75em; color: #888; display: block; }
        .stat-val { font-size: 1.1em; color: #ffcc00; font-weight: bold; }

        #log { 
            height: 80px; overflow-y: auto; background: #080808; padding: 12px; 
            border-radius: 8px; border: 1px solid #333; font-size: 0.85em; margin-bottom: 15px; color: #999;
        }

        .choices { display: flex; flex-direction: column; gap: 8px; }
        
        button { 
            background: #333; color: #eee; border: 1px solid #555; padding: 12px;
            cursor: pointer; font-size: 0.95em; text-align: left; transition: 0.2s; border-radius: 6px;
        }

        button:hover { background: #d4af37; color: #000; border-color: #fff; }

        /* 覆蓋層頁面：事件、結算、總結 */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); border-radius: 12px; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            padding: 25px; box-sizing: border-box; text-align: center; z-index: 10;
        }

        .event-card { border: 2px solid #ffcc00; padding: 20px; border-radius: 10px; background: #1a1a1a; width: 100%; }
        .event-title { color: #ffcc00; font-size: 1.3em; font-weight: bold; margin-bottom: 12px; }
        .event-body { font-size: 1.05em; line-height: 1.6; margin-bottom: 15px; }

        .summary-box { text-align: left; background: #222; padding: 18px; border-radius: 8px; border: 1px solid #d4af37; font-size: 0.85em; overflow-y: auto; width: 100%; max-height: 90%; }
        .summary-box h3 { color: #d4af37; margin-top: 0; text-align: center; }
        
        .danger { color: #ff4444; }
        .success { color: #44ff44; }
        .replay-btn { width: 100%; background: #d4af37; color: #000; font-weight: bold; margin-top: 15px; text-align: center; border: none; padding: 15px; font-size: 1.1em; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div id="game-container">
    <h2>織機與生存 1845</h2>
    
    <div class="stats">
        <div class="stat-box"><span class="stat-label">週次</span><span id="week" class="stat-val">1</span></div>
        <div class="stat-box"><span class="stat-label">英鎊 (£)</span><span id="money" class="stat-val">25</span></div>
        <div class="stat-box"><span class="stat-label">身體健康</span><span id="health" class="stat-val">100</span>%</div>
    </div>

    <div id="log">
        <div class="success">【系統】曼徹斯特，1845年。生存是你唯一的目標。</div>
    </div>

    <!-- 階段 1：工作 -->
    <div id="action-ui">
        <p style="color: #d4af37; font-weight: bold;">● 第一階段：這週要工作多久？</p>
        <div class="choices">
            <button onclick="chooseWork(1)">1. 標準班 (12hr): 工資 +£12 | 健康 -10</button>
            <button onclick="chooseWork(2)">2. 瘋狂加班 (16hr): 工資 +£18 | 健康 -25</button>
            <button onclick="chooseWork(3)">3. 稱病休息: 無收入 | 健康 +15</button>
        </div>
    </div>

    <!-- 階段 2：孩子 -->
    <div id="child-ui" style="display:none;">
        <p style="color: #d4af37; font-weight: bold;">● 第二階段：如何安排你的孩子？</p>
        <div class="choices">
            <button onclick="chooseChild(1)">1. 送去工廠清掃: 收入 +£6 | 高風險</button>
            <button onclick="chooseChild(2)">2. 在街頭拾荒: 收入 +£2 | 中風險</button>
            <button onclick="chooseChild(3)">3. 去教會學校: 學費 -£2 | 未來希望</button>
            <button onclick="chooseChild(4)">4. 留在家中躲避黑煙: 無收入 | 安全</button>
        </div>
    </div>

    <!-- 階段 3：隨機事件頁面 -->
    <div id="event-overlay" class="overlay">
        <div class="event-card">
            <div class="event-title">⚠️ 突發事件</div>
            <div id="event-content" class="event-body"></div>
            <button onclick="showSummary()" style="width:100%; text-align:center; padding: 15px;">查看週報告</button>
        </div>
    </div>

    <!-- 階段 4：週結算頁面 -->
    <div id="summary-overlay" class="overlay">
        <div style="font-size: 1.4em; font-weight: bold; margin-bottom: 10px;">✔ 第 <span id="passed-week">1</span> 週結束</div>
        <div id="week-report" style="line-height:1.6; background: #111; padding: 15px; border-radius: 8px; width: 100%; box-sizing: border-box; text-align: left;"></div>
        <button onclick="nextWeek()" style="text-align:center; width: 100%; margin-top: 20px; padding: 15px;">進入下週</button>
    </div>

    <!-- 最終總結與重玩頁面 -->
    <div id="final-overlay" class="overlay">
        <div class="summary-box">
            <h3 id="final-title"></h3>
            <p id="final-result"></p>
            <hr style="border: 0.5px solid #444;">
            <h3>【歷史學習目標】</h3>
            <p><strong>1. 英鎊的購買力：</strong> 在1845年，1英鎊相當於20先令。當時工人的週薪通常不到 2 英鎊。如果一週支出超過所得，家庭就會崩潰。</p>
            <p><strong>2. 結構性貧窮：</strong> 即使你努力工作，突發的「房租暴漲」或「工廠事故」也能讓你瞬間破產，這並非個人努力能改變的。</p>
            <p><strong>3. 休息的代價：</strong> 在沒有勞工法案的時代，休息意味著完全失去收入，這種恐懼強迫勞工即使生病也要工作。</p>
            <button onclick="replayGame()" class="replay-btn">再次挑戰（重啟人生）</button>
        </div>
    </div>
</div>

<script>
    const initialState = { week: 1, money: 25, health: 100, isResting: false };
    let state = { ...initialState };
    let turnData = { workMsg: "", childMsg: "", eventMsg: "" };

    function chooseWork(choice) {
        if(choice === 1) { state.money += 12; state.health -= 10; state.isResting = false; turnData.workMsg = "你在工廠完成了12小時輪班。"; }
        else if(choice === 2) { state.money += 18; state.health -= 25; state.isResting = false; turnData.workMsg = "你拼命加班，體力接近崩潰。"; }
        else { state.health += 15; state.isResting = true; turnData.workMsg = "你選擇在家休息恢復體力，但本週零收入。"; }
        
        document.getElementById('action-ui').style.display = 'none';
        document.getElementById('child-ui').style.display = 'block';
    }

    function chooseChild(choice) {
        if(choice === 1) { 
            state.money += 6; 
            if(Math.random() < 0.3) { turnData.childMsg = "孩子在清理機器時受傷，醫藥費扣除 £5。"; state.money -= 5; }
            else { turnData.childMsg = "孩子平安帶回了工廠工資。"; }
        } else if(choice === 2) { 
            state.money += 2; 
            if(Math.random() < 0.3) { turnData.childMsg = "孩子拾荒時染上風寒，全家健康下降。"; state.health -= 10; }
            else { turnData.childMsg = "孩子撿回了一些碎煤炭。"; }
        } else if(choice === 3) { state.money -= 2; turnData.childMsg = "孩子在學校讀書，儘管你們更餓了。"; }
        else { turnData.childMsg = "孩子留在家中躲避戶外的黑煙。"; }
        triggerEvent();
    }

    function triggerEvent() {
        // 分類事件池
        const workEvents = [
            {m: "【工廠事故】機器皮帶斷裂導致停工，工資被扣除 £4。", money: -4, health: 0},
            {m: "【工頭罰款】你因為在車間低頭被處罰 £2。", money: -2, health: 0},
            {m: "【棉絮侵襲】車間空氣太髒，你劇烈咳嗽，健康 -10。", money: 0, health: -10}
        ];
        const restEvents = [
            {m: "【憲章運動】你在家休息時參加了工人集會，雖被警察驅趕，但意志更堅強。", money: 0, health: -5},
            {m: "【地下室淹水】連日大雨讓你住的地下室淹水，濕冷導致感冒，健康 -15。", money: 0, health: -15},
            {m: "【鄰居互助】好心的鄰居分享了一塊麵包，健康 +5。", money: 0, health: 5}
        ];
        const generalEvents = [
            {m: "【房租暴漲】貧民窟房租突然上漲，你被迫多付 £4。", money: -4, health: 0},
            {m: "【衛生危機】街道污水橫流引發霍亂，你感到嚴重不適，健康 -20。", money: 0, health: -20},
            {m: "【公共福利】當地慈善團體分發了少量稀粥，健康 +5。", money: 0, health: 5}
        ];

        let pool = [...generalEvents];
        if (state.isResting) { pool = pool.concat(restEvents); } 
        else { pool = pool.concat(workEvents); }

        let e = pool[Math.floor(Math.random() * pool.length)];
        turnData.eventMsg = e.m;
        state.money += e.money;
        state.health += e.health;

        document.getElementById('event-content').innerText = e.m;
        document.getElementById('event-overlay').style.display = 'flex';
    }

    function showSummary() {
        document.getElementById('event-overlay').style.display = 'none';
        let rent = 5, food = 10;
        state.money -= (rent + food);

        document.getElementById('passed-week').innerText = state.week;
        document.getElementById('week-report').innerHTML = `
            <span style='color:#d4af37'>● 本週生活:</span> ${turnData.workMsg}<br>
            <span style='color:#d4af37'>● 孩子去向:</span> ${turnData.childMsg}<br>
            <span style='color:#ff4444'>● 固定支出:</span> 房租 £5 + 食物 £10 = <span class='danger'>-£15</span><br>
            <span style='color:#ffcc00'>● 突發事件:</span> ${turnData.eventMsg.split('】')[0]}】<br><br>
            <b>本週末餘額: £${state.money} | 當前健康: ${state.health}%</b>
        `;
        document.getElementById('summary-overlay').style.display = 'flex';
    }

    function nextWeek() {
        document.getElementById('summary-overlay').style.display = 'none';
        if (state.health <= 0 || state.money < 0 || state.week >= 10) { endGame(); } 
        else {
            state.week++;
            updateStats();
            document.getElementById('child-ui').style.display = 'none';
            document.getElementById('action-ui').style.display = 'block';
        }
    }

    function updateStats() {
        document.getElementById('week').innerText = state.week;
        document.getElementById('money').innerText = state.money;
        document.getElementById('health').innerText = state.health;
    }

    function endGame() {
        let title = "任務結束";
        let result = "";
        if(state.health <= 0) { title = "過勞致死"; result = `你在第 ${state.week} 週倒在了紡織機旁。在1845年，你的家人隨即被趕出寓所。`; } 
        else if(state.money < 0) { title = "破產收場"; result = `你付不起房租。你被抓進了債務監獄，孩子被迫分開送往救濟院。`; } 
        else { title = "艱難生存者"; result = "恭喜！你撐過了 10 週。雖然你活了下來，但貧困依舊籠罩著你的下一代。"; }
        
        document.getElementById('final-title').innerText = title;
        document.getElementById('final-result').innerText = result;
        document.getElementById('final-overlay').style.display = "flex";
    }

    function replayGame() {
        state = { ...initialState };
        updateStats();
        document.getElementById('final-overlay').style.display = "none";
        document.getElementById('child-ui').style.display = 'none';
        document.getElementById('action-ui').style.display = 'block';
        document.getElementById('log').innerHTML = '<div class="success">【系統】命運重置，回到 1845 年。</div>';
    }
</script>
</body>
</html>
